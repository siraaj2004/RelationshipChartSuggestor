
targets:
  RelationshipChartSuggestor:
    type: application
    platform: iOS
    sources:
      - RelationshipChartSuggestor
    dependencies:
      - target: RelationshipChartKeyboard
        embed: true

  RelationshipChartKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - KeyboardExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.RelationshipChartKeyboard
        INFOPLIST_FILE: KeyboardExtension/Info.plist
