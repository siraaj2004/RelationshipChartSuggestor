name: RelationshipChartSuggestor

options:
  bundleIdPrefix: com.siraaj
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  RelationshipChartSuggestor:
    type: application
    platform: iOS
    sources:
      - RelationshipChartSuggestor
      - Models.swift
      - LanguageDetector.swift
      - ChartSuggester.swift
      - OCRService.swift
    dependencies:
      - target: RelationshipChartKeyboard
        embed: true
    info:
      path: RelationshipChartSuggestor/Info.plist
      properties:
        CFBundleDisplayName: Relationship Charts
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.siraaj.relchart

  RelationshipChartKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - KeyboardExtension
      - Models.swift
      - LanguageDetector.swift
      - ChartSuggester.swift
      - OCRService.swift
    info:
      path: KeyboardExtension/Info.plist
      properties:
        CFBundleDisplayName: Chart Keyboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.siraaj.relchart.keyboard
        SKIP_INSTALL: YES

schemes:
  RelationshipChartSuggestor:
    build:
      targets:
        RelationshipChartSuggestor: all
        RelationshipChartKeyboard: all
    run:
      config: Debug
    archive:
      config: Release
