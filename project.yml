name: RelationshipChartSuggestor

options:
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  RelationshipChartSuggestor:
    type: application
    platform: iOS
    sources:
      - path: RelationshipChartSuggestor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.siraaj2004.RelationshipChartSuggestor
        PRODUCT_NAME: RelationshipChartSuggestor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RelationshipChartSuggestor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
