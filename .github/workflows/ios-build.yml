
      - name: Verify keyboard extension
        shell: bash
        run: |
          APP="build/Build/Products/Debug-iphonesimulator/RelationshipChartSuggestor.app"
          EXT="$APP/PlugIns/RelationshipChartKeyboard.appex"

          echo "Checking app: $APP"
          echo "Checking extension: $EXT"

          if [ ! -d "$APP" ]; then
            echo "ERROR: Main app not found"
            exit 1
          fi

          if [ ! -d "$EXT" ]; then
            echo "ERROR: Keyboard extension not embedded"
            echo "Available PlugIns:"
            ls -la "$APP/PlugIns" || true
            find build -name "*.appex" -print
            exit 1
          fi

          if [ ! -f "$EXT/Info.plist" ]; then
            echo "ERROR: Extension Info.plist missing"
            exit 1
          fi

          echo "SUCCESS: Keyboard extension is embedded"
