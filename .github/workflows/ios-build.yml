name: Build IPA
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Build for device (unsigned)
        run: |
          xcodebuild build \
            -project RelationshipChartSuggestor.xcodeproj \
            -scheme RelationshipChartSuggestor \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RelationshipChartSuggestor.app Payload/
          zip -qr RelationshipChartSuggestor.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: RelationshipChartSuggestor-ipa
          path: RelationshipChartSuggestor.ipa
