name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Show Swift files being built
        run: |
          git log -1 --oneline
          find . -name "*.swift" -not -path "./build/*" | sort

      - name: Build
        shell: bash
        run: |
          set +e
          xcodebuild -project RelationshipChartSuggestor.xcodeproj \
            -scheme RelationshipChartSuggestor \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}

          echo ""
          echo "=========== COMPILER ERRORS ==========="
          grep -nE "error:" build.log || echo "no 'error:' lines found"
          echo "======================================="

          exit $status

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
