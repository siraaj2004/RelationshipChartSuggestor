
name: Build RelationshipChartSuggestor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: List build targets
        run: |
          xcodebuild \
            -project RelationshipChartSuggestor.xcodeproj \
            -list

      - name: Build app and embedded keyboard
        run: |
          xcodebuild \
            -project RelationshipChartSuggestor.xcodeproj \
            -scheme RelationshipChartSuggestor \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify embedded keyboard
        run: |
          APP="build/Build/Products/Debug-iphonesimulator/RelationshipChartSuggestor.app"
          EXT="$APP/PlugIns/KeyboardExtension.appex"

          test -d "$APP" || {
            echo "Main app was not built"
            exit 1
          }

          test -d "$EXT" || {
            echo "Keyboard extension was not embedded"
            find "$APP" -maxdepth 4 -print
            exit 1
          }

          echo "SUCCESS: App and keyboard extension were built."
