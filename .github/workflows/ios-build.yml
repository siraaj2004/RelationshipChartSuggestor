      - name: Build for iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project RelationshipChartSuggestor.xcodeproj \
            -scheme RelationshipChartSuggestor \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            ENABLE_DEBUG_DYLIB=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/RelationshipChartSuggestor.app
          test -f "$APP/RelationshipChartSuggestor" || { echo "App executable missing"; exit 1; }
          test -f "$APP/PlugIns/RelationshipChartKeyboard.appex/RelationshipChartKeyboard" || { echo "Keyboard executable missing"; exit 1; }
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r RelationshipChartSuggestor.ipa Payload
