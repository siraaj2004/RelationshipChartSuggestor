- name: Install XcodeGen
  run: |
    brew install xcodegen

- name: Generate Xcode project
  run: |
    cd "$GITHUB_WORKSPACE"
    test -f project.yml
    xcodegen generate
    test -d RelationshipChartSuggestor.xcodeproj

- name: Build iOS Simulator app
  run: |
    xcodebuild \
      -project RelationshipChartSuggestor.xcodeproj \
      -scheme RelationshipChartSuggestor \
      -sdk iphonesimulator \
      -configuration Debug \
      -destination 'generic/platform=iOS Simulator' \
      CODE_SIGNING_ALLOWED=NO \
      clean build
