name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Locate Xcode project
        id: locate
        run: |
          PROJECT_PATH=$(find . -maxdepth 4 -name "RelationshipChartSuggestor.xcodeproj" -not -path "*/build/*" | head -n 1)
          if [ -z "$PROJECT_PATH" ]; then
            echo "RelationshipChartSuggestor.xcodeproj not found. Projects in repo:"
            find . -maxdepth 4 \( -name "*.xcodeproj" -o -name "*.xcworkspace" -o -name "project.yml" \)
            exit 1
          fi
          echo "Found: $PROJECT_PATH"
          echo "project=$PROJECT_PATH" >> "$GITHUB_OUTPUT"

      - name: List schemes
        run: xcodebuild -list -project "${{ steps.locate.outputs.project }}"

      - name: Build
        run: |
          xcodebuild -project "${{ steps.locate.outputs.project }}" \
            -scheme RelationshipChartSuggestor \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
            build
