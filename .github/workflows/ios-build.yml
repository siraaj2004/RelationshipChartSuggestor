name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Locate generated project
        id: locate
        run: |
          PROJECT_PATH=$(find . -maxdepth 3 -name "*.xcodeproj" -not -path "*/build/*" -not -path "*/Pods/*" | head -n 1)
          if [ -z "$PROJECT_PATH" ]; then
            echo "No .xcodeproj generated. Check project.yml."
            exit 1
          fi
          echo "Found: $PROJECT_PATH"
          echo "project=$PROJECT_PATH" >> "$GITHUB_OUTPUT"

      - name: Detect scheme
        id: scheme
        run: |
          xcodebuild -list -project "${{ steps.locate.outputs.project }}"
          SCHEME=$(xcodebuild -list -json -project "${{ steps.locate.outputs.project }}" | jq -r '.project.schemes[0]')
          echo "Using scheme: $SCHEME"
          echo "name=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          xcodebuild -project "${{ steps.locate.outputs.project }}" \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
            build
