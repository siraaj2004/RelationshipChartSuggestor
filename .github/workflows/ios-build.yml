name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Check for duplicate type declarations
        run: |
          DUPES=$(grep -rhoE "^(struct|class|enum) [A-Za-z0-9_]+" --include=*.swift RelationshipChartSuggestor KeyboardExtension 2>/dev/null | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "Duplicate declarations found:"
            echo "$DUPES"
            exit 1
          fi

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project RelationshipChartSuggestor.xcodeproj \
            -scheme RelationshipChartSuggestor \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            ENABLE_DEBUG_DYLIB=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test ${PIPESTATUS[0]} -eq 0

      - name: Verify executables exist
        run: |
          APP="build/Build/Products/Release-iphoneos/RelationshipChartSuggestor.app"
          test -f "$APP/RelationshipChartSuggestor" || { echo "Main app executable missing"; exit 1; }
          test -f "$APP/PlugIns/RelationshipChartKeyboard.appex/RelationshipChartKeyboard" || { echo "Keyboard executable missing"; exit 1; }
          echo "Both executables present"
          lipo -info "$APP/PlugIns/RelationshipChartKeyboard.appex/RelationshipChartKeyboard"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RelationshipChartSuggestor.app Payload/
          zip -qry RelationshipChartSuggestor.ipa Payload
          ls -lh RelationshipChartSuggestor.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RelationshipChartSuggestor-ipa
          path: RelationshipChartSuggestor.ipa
