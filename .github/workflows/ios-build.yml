name: Build iOS App

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      PROJECT: RelationshipChartSuggestor.xcodeproj
      SCHEME: RelationshipChartSuggestor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode and project info
        run: |
          xcodebuild -version
          ls -la
          xcodebuild -list -project "$PROJECT"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee build.log

      - name: Verify app
        run: |
          echo "Products folder:"
          ls -la build/Build/Products/ || true
          ls -la build/Build/Products/*/ || true

          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" -type d | head -n 1)
          if [ -z "$APP" ]; then
            echo "::error::No .app bundle found. Check build.log for errors."
            exit 1
          fi
          echo "Found app: $APP"
          ls -la "$APP"

          EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          echo "Executable name from Info.plist: $EXE"

          if [ ! -f "$APP/$EXE" ]; then
            echo "::error::Main executable '$EXE' missing inside $APP"
            exit 1
          fi
          echo "App verified OK"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r RelationshipChartSuggestor-unsigned.ipa Payload

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            RelationshipChartSuggestor-unsigned.ipa
            build.log
