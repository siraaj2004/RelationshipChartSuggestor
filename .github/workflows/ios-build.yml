name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Check for duplicate type declarations
        run: |
          DUPES=$(grep -rhoE "^(struct|class|enum) [A-Za-z0-9_]+" --include=*.swift RelationshipChartSuggestor KeyboardExtension 2>/dev/null | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "Duplicate declarations found:"
            echo "$DUPES"
            exit 1
          fi

      - name: Build app (includes keyboard extension)
        run: |
          set -o pipefail
          xcodebuild -project RelationshipChartSuggestor.xcodeproj \
            -scheme RelationshipChartSuggestor \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          test ${PIPESTATUS[0]} -eq 0
